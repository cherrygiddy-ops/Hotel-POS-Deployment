services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - apigateway
    networks:
      - hotelpos_net
    restart: always


  frontend:
    image: ghcr.io/cherrygiddy-ops/hotelpos_frontend:latest
    container_name: frontend
    ports:
      - "8085:80"
    networks:
      - hotelpos_net
    restart: always


  authservice:
    image: ghcr.io/cherrygiddy-ops/hotelpos_authservice:latest
    container_name: authservice
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${POSTGRES_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - postgres
      - eureka
    networks:
      - hotelpos_net
    restart: always


  orderservice:
    image: ghcr.io/cherrygiddy-ops/hotelpos_orderservice:latest
    container_name: orderservice
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${MONGO_HOST}
      DB_USER: ${MONGO_USER}
      DB_PASSWORD: ${MONGO_PASSWORD}
      DB_NAME: ${MONGO_DB}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - mongodb
      - eureka
    networks:
      - hotelpos_net
    restart: always


  apigateway:
    image: ghcr.io/cherrygiddy-ops/hotelpos_apigateway:latest
    container_name: apigateway
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - eureka
      - authservice
      - orderservice
    networks:
      - hotelpos_net
    restart: always


  eureka:
    image: ghcr.io/cherrygiddy-ops/hotelpos_eureka:latest
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - hotelpos_net
    restart: always


  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotelpos_net


  mongodb:
    image: mongo:4.4
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - hotelpos_net


volumes:
  postgres_data:
  mongo_data:


networks:
  hotelpos_net:
    driver: bridge